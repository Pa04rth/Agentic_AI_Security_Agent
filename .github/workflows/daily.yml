name: CTO Executive Intelligence Engine

# Free serverless cron. GitHub Actions cron is ALWAYS in UTC.
# We want 05:00 IST (Asia/Kolkata, UTC+5:30) => 23:30 UTC the previous day.
# main.py computes the weekday in IST too, so Sunday-vs-weekday routing matches
# the Indian calendar day (Sunday firehose fires on Sunday IST).
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # needed to commit the local dedup ledger back

concurrency:
  group: cto-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/main.py

      - name: Commit dedup ledger
        run: |
          git config user.name "cto-engine-bot"
          git config user.email "actions@github.com"
          git add archive/ || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "chore: update digest dedup ledger [skip ci]"
            git push
          fi
